name: Feature request
description: Propose one concrete capability or behavior change.
title: "feat: "
labels: ["enhancement", "triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the user outcome that is currently impossible or unreliable. Avoid prescribing an implementation first.
    validations:
      required: true
  - type: textarea
    id: use-case
    attributes:
      label: Concrete use case
      description: Show the workflow, inputs, expected result, and frequency.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Include public contract, compatibility, authorization, and failure semantics when relevant.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Explain why existing tools or simpler composition do not solve the problem.
  - type: textarea
    id: risk
    attributes:
      label: Security, privacy, and operational risk
      description: Identify new authority, sensitive inputs, side effects, limits, and rollback concerns.
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Pre-submission checks
      options:
        - label: I searched existing issues and documentation for the same request.
          required: true
        - label: This issue contains no credentials, private identifiers, or sensitive user content.
          required: true
