name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.os }} / Node 26
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Prepare integrity-verified npm
        run: node scripts/prepare-pinned-npm.mjs
      - run: npm --version
      - run: npm ci
      - run: npm run check
      - name: Test documented global installation
        run: npm run install:test

  package-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Prepare integrity-verified npm
        run: node scripts/prepare-pinned-npm.mjs
      - run: npm --version
      - run: npm ci
      - run: npm run privacy:history
      - run: npm run install:test
      - run: npm audit --audit-level=high
      - run: npm audit --omit=dev --audit-level=high
      - run: npm audit signatures
      - run: npm sbom --sbom-format cyclonedx > "$RUNNER_TEMP/sbom.json"
      - run: node -e "const b=require(process.env.RUNNER_TEMP + '/sbom.json'); if(b.bomFormat!=='CycloneDX' || !Array.isArray(b.components)) process.exit(1)"
      - run: npm pack --dry-run
