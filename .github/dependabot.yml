version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm-dependencies:
        patterns:
          - "*"
  - package-ecosystem: npm
    directory: /src/local/wrangler-toolchain
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      cloudflare-toolchain:
        patterns:
          - "*"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
